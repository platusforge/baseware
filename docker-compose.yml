# ── Base: shared services, networks, volumes ──────────────────────────────
# Dev:   docker compose up
# Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-network]

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-saas-boilerplate}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-saas-boilerplate-web}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@example.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - POSTHOG_KEY=${POSTHOG_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [app-network]
    depends_on: [db]

  web:
    build:
      context: ./web
      dockerfile: dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
        - VITE_POSTHOG_KEY=${POSTHOG_KEY:-}
        - VITE_SENTRY_DSN=${SENTRY_DSN:-}
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
