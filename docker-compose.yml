# ── Base: shared services, networks, volumes ──────────────────────────────
# Dev:   docker compose up
# Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
name: baseware

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-network]

  server:
    build:
      context: .
      dockerfile: ./server/dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-baseware}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-baseware-web}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@example.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-10}
      - REDIS_URL=${REDIS_URL:-}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-memory}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-10}
      - RESET_RATE_LIMIT_MAX=${RESET_RATE_LIMIT_MAX:-3}
      - REGISTER_RATE_LIMIT_MAX=${REGISTER_RATE_LIMIT_MAX:-20}
      - REQUIRE_VERIFIED_EMAIL=${REQUIRE_VERIFIED_EMAIL:-true}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - APP_HOST=${APP_HOST:-app.example.com}
      - POSTHOG_KEY=${POSTHOG_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [app-network]
    depends_on: [db]

  web:
    build:
      context: .
      dockerfile: ./web/dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
        - VITE_POSTHOG_KEY=${POSTHOG_KEY:-}
        - VITE_SENTRY_DSN=${SENTRY_DSN:-}
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
