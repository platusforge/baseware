# ── Dev override: hot reload, bind mounts, exposed ports ─────────────────
# Auto-loaded by `docker compose up`.
services:
  db:
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  server:
    build:
      target: development
    command: tsx watch src/bin/www.ts
    volumes:
      - ./server:/app/server
      - /app/node_modules
      - /app/server/node_modules
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - CHOKIDAR_USEPOLLING=1
    ports: ["${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      target: development
    volumes:
      - ./web:/app/web
      - /app/node_modules
      - /app/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
    ports: ["5173:5173"]
